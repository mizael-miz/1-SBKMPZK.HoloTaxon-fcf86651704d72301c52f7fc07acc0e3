name: Validate HoloTaxon

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate stage protocol and gate state
        run: npm run protocol:validate
      - name: Type-check
        run: npm run typecheck
      - name: Run schema-engine tests
        run: npm test
      - name: Build Obsidian plugin
        run: npm run build
      - name: Smoke-test Obsidian plugin entrypoint export
        run: npm run test:entrypoint
      - name: Ensure committed build artifacts are reproducible
        run: git diff --exit-code -- main.js styles.css
      - name: Assemble clean installation bundle
        run: npm run package:plugin
      - name: Upload installable plugin bundle
        uses: actions/upload-artifact@v4
        with:
          name: HoloTaxon-plugin
          path: artifacts/HoloTaxon/
          if-no-files-found: error
          retention-days: 30
