adr_id: ADR-0002
title: "Single-file bundle target layout"
status: proposed
created_at: "2026-10-25T14:20:00Z"
decision_maker: project-owner-human
context: >-
  Obsidian's sample plugin uses a single bundled CommonJS main.js. PRs #13-#15
  propose bundling, but loader acceptance and selection among implementations
  remain subject to AUD-0001 and TSK-0003.
decision:
  target_layout:
    main_js: self-contained_CommonJS_bundle
    external_modules: [obsidian]
    package_files: [main.js, manifest.json, styles.css]
  implementation_selection: pending_AUD-0001_and_TSK-0003
alternatives:
  - split main.js plus dist modules
consequences:
  - proposed target only; does not authorize merge or establish live acceptance
  - external module set must be checked against actual build and host contract
evidence_refs: [EVD-0005, EVD-0007]
ticket_refs: [TSK-0003-BUNDLING-SELECTION]
human_acceptance:
  status: pending
  accepted_at: null
  accepted_by: null
